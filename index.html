<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Saver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">🔖</div>
        <div class="header-text">
          <h1>Web Saver</h1>
        </div>
      </header>

      <form id="add-form" novalidate>
        <div class="form-row">
          <input
            id="url-input"
            type="url"
            placeholder="Enter URL or click +Page"
            autocomplete="off"
            required
          />
          <button type="button" id="add-current-btn" class="btn btn-icon" title="Add current page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </div>
        <div class="form-row">
          <input
            id="title-input"
            type="text"
            placeholder="Title (optional)"
            autocomplete="off"
            class="input-title"
          />
          <input
            id="label-input"
            type="text"
            placeholder="Label"
            autocomplete="off"
            class="input-label"
            list="default-labels"
          />
          <datalist id="default-labels">
            <option value="Work"></option>
            <option value="Personal"></option>
            <option value="News"></option>
            <option value="Docs"></option>
            <option value="Shop"></option>
          </datalist>
        </div>
        <button type="submit" class="btn btn-primary">Save Link</button>
        <p id="form-error" class="error" aria-live="polite"></p>
      </form>

      <div class="search-container">
        <input
          id="search-input"
          type="search"
          placeholder="Search links..."
          autocomplete="off"
        />
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <div id="filter-container" class="filter-container"></div>

      <section id="links-section">
        <p id="empty-message" class="empty-message">No saved links yet</p>
        <ul id="links-list" aria-label="Saved links"></ul>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
